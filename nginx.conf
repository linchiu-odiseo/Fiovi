server {
  # Puerto alineado con el mapping `3007:3007` del compose.yml en ambos
  # ambientes (dev y prod). Cambiarlo requiere actualizar `EXPOSE` en el
  # Dockerfile y el `ports:` del compose en paralelo.
  listen 3007;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Oculta la versión de nginx en el header `Server` y en páginas de error
  # (fingerprinting → dificulta explotar CVEs específicos de versión).
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers globales del server. NOTA: nginx descarta estos
  # add_header en cualquier location que defina add_header propio, por eso
  # el snippet se re-incluye abajo en cada bloque relevante.
  include /etc/nginx/snippets/security-headers.conf;

  # index.html y service worker: nunca cacheados (asi los clientes ven nuevos deploys)
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  location = /ngsw.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  location = /ngsw-worker.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  location = /safety-worker.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Assets con hash en el nombre: cache largo + immutable
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|ico)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  # SPA fallback: cualquier ruta no resuelta cae a index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
