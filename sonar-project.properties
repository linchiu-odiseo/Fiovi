sonar.projectKey=odiseo-peru_Fiovi_d22a4828-2294-42d6-a318-0fe5148a2779
sonar.projectName=Fiovi
sonar.host.url=https://dev-sonar-learnex.lumeria.pe/

# Angular (esbuild). Código en src/ con capas L1_domain..LR_render.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/*.spec.ts,**/*.d.ts,src/index.html
sonar.typescript.tsconfigPaths=tsconfig.app.json

# Fuentes en UTF-8: sin esto el scanner cae al charset por defecto de la JVM y
# mis-decodifica tildes/ñ, corriendo las posiciones del código.
sonar.sourceEncoding=UTF-8

# ── Reglas suprimidas (solo falsos positivos reales del scanner) ──
sonar.issue.ignore.multicriteria=e1

# S1135 — "todo"/"todas" es palabra española frecuente en comentarios de UI
# (ej. `type QuestionsFilter = 'todas' | 'marcadas' | 'blancos'`) que el
# matcher case-insensitive de Sonar dispara como TODO. Para TODOs reales, code
# review. Mismo patrón que learnex.
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
