<!doctype html>
<html lang="es-PE" translate="no">
  <head>
    <meta charset="utf-8" />
    <title>Fiovi</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <!--
      Bloquea auto-traducción del navegador (Chrome Android principalmente):
      sin esto, traductores agresivos convierten letras sueltas "A B C D E"
      de las bubbles del simulacro en notas de solfeo ("do", "mi", "re") y
      rompen la cartilla. `translate="no"` en <html> cubre todo el árbol DOM;
      la meta `google content="notranslate"` además suprime el banner
      "¿Traducir esta página?" específico de Chrome.
    -->
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#020E27" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fiovi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.json" />
    <!--
      Content Security Policy.
      Defensa contra XSS roba-bearer (design D4): cualquier script inyectado
      no podrá emitir requests a hosts arbitrarios, solo a 'self' (la propia
      PWA) y al backend explícitamente listado en `connect-src`.

      El origin del backend en `connect-src` lo MANTIENE SINCRONIZADO el
      script `scripts/build-env.mjs` con `API_BASE_URL` del `.env`. NO editar
      a mano: el próximo `npm run dev`/`build`/`test` lo va a reescribir.

      PROD: este meta CSP queda incluido en el bundle. Si el server que
      sirve la PWA en producción además inyecta un CSP via HTTP header, ese
      header gana — útil para directivas más estrictas que requieran nonce.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://api.yangpimpollo.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!--
      Tipografía del design system Native Excellence — se carga desde Google
      Fonts vía CSP allowlist (style-src incluye fonts.googleapis.com, font-src
      incluye fonts.gstatic.com). `display=swap` evita FOIT bloqueante en
      conexiones lentas; el fallback de var(--font-body) cubre el primer paint.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Press+Start+2P&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <!--
      Identidad visual dual (intencional):
      - Pestaña del navegador (favicon-*.png / favicon.ico) usa el motivo
        cartilla+lápiz — distintivo del producto, más reconocible entre 20
        tabs abiertos que un icono de marca.
      - Home screen / splash / PWA install usan el motivo águila (icon_x*.png
        y icon_maskable_x*.png en manifest.json) — identidad de marca.
      - apple-touch-startup-image: iOS solo respeta estos links y hace match
        exacto por (device-width, device-height, DPR). Sin coincidencia,
        pantalla blanca al abrir el PWA desde home screen. Las imágenes son
        bg #020E27 + logo águila centrado, generadas desde
        public/img/logo_master.png.
    -->
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon_x180.png" />
    <link
      rel="apple-touch-startup-image"
      href="apple-splash/apple-splash-750x1334.png"

    />
