<main class="login">
  <header class="login__header">
    <img
      src="img/favicon_transparent.png"
      alt=""
      class="login__brand-img"
      width="80"
      height="80"
      aria-hidden="true"
    />
    <h1 class="login__title">Fiovi</h1>
    <p class="login__subtitle">Inicia sesión para continuar</p>
  </header>

  <!-- Grupo SSO + toggle "Iniciar con email". Toda la sección se oculta
       cuando el user expande el form de email — el toggle inverso "Volver
       a Google" al pie del form devuelve la vista a este bloque. Evita
       mostrar dos CTAs primarios (Google + Ingresar) compitiendo entre sí. -->
  @if (vm.ssoProviders().length > 0 && !emailFormExpanded()) {
    @for (p of vm.ssoProviders(); track p.provider) {
      <button
        type="button"
        class="login__google-btn"
        [attr.data-testid]="'btn-sso-' + p.provider"
        (click)="onSsoProviderClick(p.provider)"
      >
        @if (p.provider === 'google') {
          <!-- Logo G oficial de Google (multicolor). Inline SVG para no depender de assets. -->
          <svg
            class="login__google-btn-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            width="20"
            height="20"
          >
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
        }
        Continuar con {{ p.displayName }}
      </button>
    }

    <button
      type="button"
      class="login__toggle-email"
      data-testid="btn-toggle-email"
      (click)="expandEmailForm()"
    >
      Iniciar con email
    </button>
  }

  <!--
    Sección colapsable con el form de email. Siempre montada en el DOM (el
    captcha widget necesita instanciarse al load para hacer challenge silencioso
    y tener token listo cuando el usuario expande). Colapso puramente visual
    con max-height + opacity transitions; el DOM subyacente sigue vivo.
    Cuando no hay providers SSO, `emailFormEffectivelyExpanded` es true y el
    form aparece de una — no tiene sentido colapsarlo si es la única vía.
  -->
  <section
    class="login__email-collapse"
    [class.login__email-collapse--expanded]="emailFormEffectivelyExpanded()"
    [attr.aria-hidden]="!emailFormEffectivelyExpanded()"
  >
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="login__form">
      <label class="field">
        <div class="field__input-wrap">
          <span class="material-symbols-outlined field__icon" aria-hidden="true">mail</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            inputmode="email"
            spellcheck="false"
            placeholder="Ingresa tu correo electrónico"
            aria-label="Correo electrónico"
            class="field__input"
          />
        </div>
        @if (form.controls.email.touched && form.controls.email.errors?.['required']) {
          <small class="field__hint">El email es obligatorio.</small>
        }
        @if (form.controls.email.touched && form.controls.email.errors?.['email']) {
          <small class="field__hint">Email inválido.</small>
        }
      </label>

      <label class="field">
        <div class="field__input-wrap">
          <span class="material-symbols-outlined field__icon" aria-hidden="true">lock</span>
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Ingresa tu contraseña"
            aria-label="Contraseña"
            class="field__input field__input--with-toggle"
          />
          <button
            type="button"
            class="field__toggle"
            data-testid="btn-password-toggle"
            [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="passwordVisible()"
            (click)="togglePasswordVisibility()"
          >
            <span class="material-symbols-outlined" aria-hidden="true">
              {{ passwordVisible() ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
        @if (form.controls.password.touched && form.controls.password.errors?.['required']) {
          <small class="field__hint">La contraseña es obligatoria.</small>
        }
      </label>

      @if (vm.errorMessage(); as msg) {
        <p class="error" role="alert">
          <span class="material-symbols-outlined error__icon" aria-hidden="true">error</span>
          <span class="error__copy">{{ msg }}</span>
        </p>
      }

      @if (captchaEnabled) {
        <app-captcha-widget #captcha (tokenChange)="onCaptchaTokenChange($event)" />
      }

      <button
        type="submit"
        class="login__submit"
        [disabled]="form.invalid || vm.isSubmitting() || (captchaEnabled && !captchaToken())"
      >
        @if (vm.isSubmitting()) {
          Ingresando…
        } @else {
          Ingresar
        }
      </button>

      @if (vm.ssoProviders().length > 0 && emailFormExpanded()) {
        <button
          type="button"
          class="login__collapse-email"
          data-testid="btn-collapse-email"
          (click)="collapseEmailForm()"
        >
          <span class="material-symbols-outlined" aria-hidden="true">expand_less</span>
          Volver a Google
        </button>
      }
    </form>
  </section>

  <app-version-footer />
</main>
