# Security headers de respuesta HTTP.
#
# Se incluye en cada `location` de `nginx.conf` porque nginx aplica una regla
# poco intuitiva: si un `location` define AL MENOS UN `add_header`, se
# descartan todos los `add_header` heredados del scope padre. Sin este
# include repetido, las respuestas de `/index.html`, `/ngsw.json`,
# `/ngsw-worker.js`, `/safety-worker.js` y de los assets con cache-control
# propio saldrían sin los headers de seguridad — justo los recursos más
# críticos.
#
# Flag `always`: emite los headers también en respuestas de error (4xx/5xx),
# no solo en 2xx/3xx.
#
# Sobre el CSP `frame-ancestors 'none'`: el CSP principal vive en el
# `<meta http-equiv>` de `src/index.html` porque `scripts/build-env.mjs`
# sincroniza el `connect-src` con `API_BASE_URL` de `.env` en cada build.
# Sin embargo, la directiva `frame-ancestors` es ignorada por spec cuando
# el CSP se declara en meta — solo funciona en header HTTP. Por eso se
# emite acá como un CSP separado con únicamente esa directiva; los
# navegadores mergean múltiples CSPs con la política más estricta.

add_header X-Frame-Options         "DENY"                                    always;
add_header X-Content-Type-Options  "nosniff"                                 always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"         always;
add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'"                  always;
